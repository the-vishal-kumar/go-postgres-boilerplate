# Unit and integration tests with only Docker installed: make test
name: gpb-test

services:
  tests:
    image: golang:1.27.4-bookworm
    working_dir: /src
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      HOME: /tmp
      GOPATH: /src/.cache/gopath
      GOCACHE: /src/.cache/gocache
      GOFLAGS: -buildvcs=false
      DATABASE_URL: postgres://loan:loan@db:5432/loan_test
    volumes:
      - ./:/src
    command: ['go', 'test', '-race', '-count=1', '-cover', './...']
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan
      POSTGRES_DB: loan_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loan -d loan_test']
      interval: 2s
      timeout: 5s
      retries: 30
